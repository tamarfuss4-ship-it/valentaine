<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valentine</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"/>

<style>
/* ─── Reset & Variables ─── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --pink-bg: #ffcdd2;
  --pink-light: #ffe0e3;
  --pink-card: rgba(255,255,255,0.55);
  --rose: #e8546c;
  --rose-hover: #d4405a;
  --red: #e53935;
  --red-hover: #c62828;
  --text-dark: #5a2d3e;
  --text-mid: #7a4558;
  --shadow: 0 8px 32px rgba(90,45,62,0.12);
  --shadow-btn: 0 4px 16px rgba(232,84,108,0.30);
}

body {
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--pink-bg);
  font-family: 'Poppins', sans-serif;
  position: relative;
}

/* ─── Floating Hearts ─── */
.hearts-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.heart {
  position: absolute;
  bottom: -60px;
  opacity: 0;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
  5%   { opacity: 0.55; }
  90%  { opacity: 0.4; }
  100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
}

/* ─── Card ─── */
.card {
  position: relative;
  z-index: 1;
  background: var(--pink-card);
  backdrop-filter: blur(12px);
  border-radius: 28px;
  box-shadow: var(--shadow);
  padding: 48px 36px 44px;
  width: min(440px, 90vw);
  text-align: center;
}

.deco {
  font-size: 18px;
  letter-spacing: 6px;
  margin-bottom: 18px;
  opacity: 0.7;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 600;
  font-size: clamp(20px, 5vw, 26px);
  color: var(--text-dark);
  line-height: 1.5;
  margin-bottom: 36px;
}

/* ─── Buttons ─── */
.stage {
  position: relative;
  width: 100%;
  height: 140px;
}

#yes {
  position: absolute;
  left: 18%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: var(--rose);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 14px 36px;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow-btn);
  animation: pulse 2s infinite;
}

#yes:hover {
  background: var(--rose-hover);
}

@keyframes pulse {
  50% { box-shadow: 0 6px 28px rgba(232,84,108,0.55); }
}

#no {
  position: absolute;
  left: 72%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 14px 32px;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
}

#no:hover {
  background: var(--red-hover);
}

/* ─── Success ─── */
.success-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--pink-bg);
  z-index: 100;
}

.success-card {
  background: var(--pink-card);
  backdrop-filter: blur(12px);
  border-radius: 28px;
  box-shadow: var(--shadow);
  padding: 52px 40px;
  text-align: center;
}

.success-card h2 {
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  color: var(--text-dark);
}
</style>
</head>

<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="card">
  <div class="deco">🌸 🩷 🌸</div>

  <h1>
    Eden, will you be my valentine?<br/>
    🥹🥹🥹🥹🐰🩷🤍😍😍😍😍
  </h1>

  <div class="stage" id="stage">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
</div>

<script>
(function(){
  const bg = document.getElementById("heartsBg");
  const heartEmojis = ["🩷","💗","🌸","💖","🤍"];

  for (let i = 0; i < 20; i++) {
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = heartEmojis[i % heartEmojis.length];
    h.style.left = Math.random() * 100 + "%";
    h.style.animationDuration = (6 + Math.random() * 6) + "s";
    h.style.fontSize = (14 + Math.random() * 18) + "px";
    bg.appendChild(h);
  }

  const yes = document.getElementById("yes");
  const no = document.getElementById("no");

  no.addEventListener("click", () => {
    no.style.left = Math.random() * 80 + "%";
    no.style.top = Math.random() * 80 + "%";
    yes.style.transform = "translate(-50%, -50%) scale(1.2)";
  });

  yes.addEventListener("click", () => {
    document.body.innerHTML = `
      <div class="success-screen">
        <div class="success-card">
          <div class="deco">🌸 🩷 🌸</div>
          <h2>Yesss 🐰🩷</h2>
          <p>Happy Valentine’s 💕</p>
        </div>
      </div>
    `;
  });
})();
</script>

</body>
</html>
