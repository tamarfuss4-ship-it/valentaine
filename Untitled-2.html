<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Valentine</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  /* ─── Reset & Variables ─── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–pink-bg:      #ffcdd2;
–pink-light:   #ffe0e3;
–pink-card:    rgba(255,255,255,0.55);
–rose:         #e8546c;
–rose-hover:   #d4405a;
–red:          #e53935;
–red-hover:    #c62828;
–text-dark:    #5a2d3e;
–text-mid:     #7a4558;
–shadow:       0 8px 32px rgba(90,45,62,0.12);
–shadow-btn:   0 4px 16px rgba(232,84,108,0.30);
}

body {
min-height: 100vh;
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
background: var(–pink-bg);
font-family: ‘Poppins’, sans-serif;
position: relative;
}

/* ─── Floating Hearts Background ─── */
.hearts-bg {
position: fixed; inset: 0;
pointer-events: none;
z-index: 0;
overflow: hidden;
}
.heart {
position: absolute;
bottom: -60px;
opacity: 0;
font-size: 20px;
animation: floatUp linear infinite;
}
@keyframes floatUp {
0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
5%   { opacity: 0.55; }
90%  { opacity: 0.4; }
100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
}

/* ─── Card ─── */
.card {
position: relative;
z-index: 1;
background: var(–pink-card);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255,255,255,0.6);
border-radius: 28px;
box-shadow: var(–shadow);
padding: 48px 36px 44px;
width: min(440px, 90vw);
text-align: center;
}

/* small decorative hearts row */
.deco { font-size: 18px; letter-spacing: 6px; margin-bottom: 18px; opacity: 0.7; }

h1 {
font-family: ‘Playfair Display’, serif;
font-weight: 600;
font-size: clamp(20px, 5vw, 26px);
color: var(–text-dark);
line-height: 1.5;
margin-bottom: 36px;
}

/* ─── Button Stage ─── */
.stage {
position: relative;
width: 100%;
height: 140px;
}

/* ─── Yes Button ─── */
#yes {
position: absolute;
left: 18%;
top: 50%;
transform: translate(-50%, -50%) scale(1);
transform-origin: center;
background: var(–rose);
color: #fff;
border: none;
border-radius: 50px;
padding: 14px 36px;
font-family: ‘Poppins’, sans-serif;
font-size: 18px;
font-weight: 600;
letter-spacing: 0.5px;
box-shadow: var(–shadow-btn);
cursor: pointer;
-webkit-tap-highlight-color: transparent;
transition: transform 0.3s cubic-bezier(.4,0,.2,1),
box-shadow 0.3s ease;
z-index: 2;
animation: pulse 2s ease infinite;
}
#yes:hover { background: var(–rose-hover); box-shadow: 0 6px 24px rgba(232,84,108,0.45); }

@keyframes pulse {
0%, 100% { box-shadow: 0 4px 16px rgba(232,84,108,0.30); }
50%      { box-shadow: 0 4px 28px rgba(232,84,108,0.55); }
}

/* ─── No Button ─── */
#no {
position: absolute;
left: 72%;
top: 50%;
transform: translate(-50%, -50%);
background: var(–red);
color: #fff;
border: none;
border-radius: 50px;
padding: 14px 32px;
font-family: ‘Poppins’, sans-serif;
font-size: 18px;
font-weight: 600;
letter-spacing: 0.5px;
box-shadow: 0 4px 14px rgba(229,57,53,0.28);
cursor: pointer;
-webkit-tap-highlight-color: transparent;
transition: left 0.42s cubic-bezier(.4,0,.2,1),
top  0.42s cubic-bezier(.4,0,.2,1),
transform 0.1s;
z-index: 2;
}
#no:hover { background: var(–red-hover); }

/* ─── Subtle arrow indicator (appears after first No) ─── */
.arrow-hint {
position: absolute;
bottom: 2px;
left: 18%;
transform: translateX(-50%);
display: flex;
flex-direction: column;
align-items: center;
gap: 2px;
opacity: 0;
transition: opacity 0.5s ease;
pointer-events: none;
z-index: 1;
}
.arrow-hint.visible { opacity: 1; }

.arrow-hint .line {
width: 2px;
background: var(–rose);
border-radius: 2px;
animation: grow 1.1s ease infinite alternate;
}
.arrow-hint .line:nth-child(1) { height: 6px; animation-delay: 0s; }
.arrow-hint .line:nth-child(2) { height: 10px; animation-delay: 0.15s; }
.arrow-hint .line:nth-child(3) { height: 14px; animation-delay: 0.3s; }
.arrow-hint .chevron {
width: 10px; height: 10px;
border-right: 2px solid var(–rose);
border-bottom: 2px solid var(–rose);
transform: rotate(45deg);
margin-top: -2px;
animation: grow 1.1s ease infinite alternate;
}
@keyframes grow {
from { opacity: 0.35; }
to   { opacity: 1; }
}

/* ─── Success Screen ─── */
.success-screen {
position: fixed; inset: 0;
display: flex; align-items: center; justify-content: center;
background: var(–pink-bg);
z-index: 100;
opacity: 0;
animation: fadeIn 0.5s ease forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

.success-card {
background: var(–pink-card);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255,255,255,0.6);
border-radius: 28px;
box-shadow: var(–shadow);
padding: 52px 40px 48px;
text-align: center;
width: min(380px, 88vw);
}
.success-card .deco { margin-bottom: 22px; font-size: 22px; }
.success-card h2 {
font-family: ‘Playfair Display’, serif;
font-style: italic;
font-weight: 400;
font-size: clamp(28px, 6.5vw, 38px);
color: var(–text-dark);
margin-bottom: 10px;
}
.success-card p {
font-size: 16px;
color: var(–text-mid);
font-weight: 500;
}
</style>

</head>
<body>

<!-- floating hearts layer -->

<div class="hearts-bg" id="heartsBg"></div>

<!-- main card -->

<div class="card">
  <div class="deco">:cherry_blossom: 🩷 :cherry_blossom:</div>
  <h1>Eden, will you be my valentine?<br/>:face_holding_back_tears::face_holding_back_tears::face_holding_back_tears::face_holding_back_tears::rabbit:🩷:white_heart::heart_eyes::heart_eyes::heart_eyes::heart_eyes:</h1>

  <div class="stage" id="stage">
    <button id="yes">Yes</button>
    <button id="no">No</button>

  <div class="line"></div>

  </div>

<script>
(function(){
  /* ─── Floating hearts ─── */
  const bg = document.getElementById("heartsBg");
  const heartEmojis = ["🩷",":heartpulse:",":cherry_blossom:",":sparkling_heart:",":white_heart:"];
  for (let i = 0; i < 18; i++) {
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = heartEmojis[i % heartEmojis.length];
    h.style.left = (Math.random() * 100) + "%";
    h.style.animationDuration = (6 + Math.random() * 8) + "s";
    h.style.animationDelay   = (Math.random() * 10) + "s";
    h.style.fontSize          = (14 + Math.random() * 18) + "px";
    bg.appendChild(h);
  }

  /* ─── Core logic ─── */
  const stage     = document.getElementById("stage");
  const yesBtn    = document.getElementById("yes");
  const noBtn     = document.getElementById("no");
  const arrowHint = document.getElementById("arrowHint");

  let yesScale  = 1;
  let lastCorner = -1;
  let locked    = false;

  /* corners relative to stage */
  function getCorners() {
    const sW = stage.offsetWidth;
    const sH = stage.offsetHeight;
    const bW = noBtn.offsetWidth;
    const bH = noBtn.offsetHeight;
    const p  = 6;
    return [
      { x: p,          y: p },
      { x: sW - bW - p, y: p },
      { x: p,          y: sH - bH - p },
      { x: sW - bW - p, y: sH - bH - p }
    ];
  }

  function dodgeNo() {
    const corners = getCorners();
    let idx;
    do { idx = Math.floor(Math.random() * corners.length); }
    while (idx === lastCorner);
    lastCorner = idx;

    noBtn.style.left      = corners[idx].x + "px";
    noBtn.style.top       = corners[idx].y + "px";
    noBtn.style.transform = "none";
  }

  function growYes() {
    yesScale += 0.14;
    // keep Yes anchored in left area, just scale up
    yesBtn.style.transform = `translate(-50%, -50%) scale(${yesScale})`;
    yesBtn.style.boxShadow = `0 4px ${16 + yesScale * 10}px rgba(232,84,108,${0.28 + yesScale * 0.08})`;

    // show arrow hint
    arrowHint.classList.add("visible");
  }

  /* ─── No handler ─── */
  function onNo(e) {
    e.preventDefault();
    if (locked) return;
    locked = true;
    dodgeNo();
    growYes();
    setTimeout(() => { locked = false; }, 450);
  }
  noBtn.addEventListener("click",    onNo);
  noBtn.addEventListener("touchend", onNo);

  /* ─── Yes handler ─── */
  function onYes(e) {
    e.preventDefault();
    document.body.innerHTML = `
      <div class="hearts-bg" id="heartsBg2"></div>
      <div class="success-screen">
        <div class="success-card">
          <div class="deco">:cherry_blossom: 🩷 :cherry_blossom:</div>
          <h2>Yessss :rabbit:🩷</h2>
          <p>Happy Valentine's, Eden! :heart_eyes::white_heart:</p>
        </div>
      </div>`;
    // re-spawn hearts on success too
    const bg2 = document.getElementById("heartsBg2");
    const heartEmojis2 = ["🩷",":heartpulse:",":cherry_blossom:",":sparkling_heart:",":white_heart:"];
    for (let i = 0; i < 22; i++) {
      const h = document.createElement("span");
      h.className = "heart";
      h.textContent = heartEmojis2[i % heartEmojis2.length];
      h.style.left = (Math.random() * 100) + "%";
      h.style.animationDuration = (5 + Math.random() * 7) + "s";
      h.style.animationDelay   = (Math.random() * 3) + "s";
      h.style.fontSize          = (16 + Math.random() * 22) + "px";
      bg2.appendChild(h);
    }
  }
  yesBtn.addEventListener("click",    onYes);
  yesBtn.addEventListener("touchend", onYes);
})();
</script>

</body>
</html>
